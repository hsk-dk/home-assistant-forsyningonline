name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'

categories:
  - title: '🛠 Breaking changes'
    labels: ['breaking-change', 'major']
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug fixes'
    labels: ['fix', 'bugfix', 'bug']
  - title: '🧰 Maintenance'
    labels: ['chore', 'dependencies', 'maintenance', 'refactor']
  - title: '📚 Documentation'
    labels: ['documentation', 'docs']
  - title: '🔒 Security'
    labels: ['security']

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ['major', 'breaking-change']
  minor:
    labels: ['minor', 'feature', 'enhancement']
  patch:
    labels: ['patch', 'fix', 'bugfix', 'chore', 'dependencies', 'maintenance', 'documentation']
  default: patch

exclude-labels:
  - 'skip-changelog'

autolabeler:
  - label: 'documentation'
    files: ['*.md', 'docs/**/*']
    title: ['/^docs/i']
  - label: 'bug'
    branch: ['/fix\/.+/']
    title: ['/^fix/i']
  - label: 'feature'
    branch: ['/feature\/.+/']
    title: ['/^feat/i']
  - label: 'chore'
    branch: ['/chore\/.+/']
    title: ['/^chore/i', '/bump/i']

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ## Installation and update

  - **Marketplace / HACS**: Update under Settings → Updates (HA 2026.11+), or in HACS.
  - **Manual**: Download `forsyningonline.zip` from this release, extract it to
    `config/custom_components/forsyningonline/` and restart Home Assistant.

  Restart Home Assistant after updating. Make a backup first.

  ## Say thanks

  <a href="https://www.buymeacoffee.com/hskdk" target="_blank"><img src="https://www.buymeacoffee.com/assets/img/custom_images/orange_img.png" alt="Buy Me A Coffee" style="height: 41px !important;width: 174px !important;" ></a>
